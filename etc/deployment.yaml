## Test mount efs to k8s
apiVersion: v1
kind: PersistentVolume
metadata:
  name: efs-demo-pv
spec:
  capacity:
    storage: 5Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: "efs-sc"
  csi:
    driver: efs.csi.aws.com
    volumeHandle: fs-xxx
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: efs-demo-pvc
spec:
  accessModes: [ReadWriteMany]
  storageClassName: "efs-sc"
  volumeName: efs-demo-pv
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: efs-demo-app
  labels:
    app: efs-demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: efs-demo-app
  template:
    metadata:
      labels:
        app: efs-demo-app
    spec:
      nodeSelector:
        workload-type: general
      containers:
        - name: app
          image: nginx
          volumeMounts:
            - name: efs-data
              mountPath: /data
      volumes:
        - name: efs-data
          persistentVolumeClaim:
            claimName: efs-demo-pvc