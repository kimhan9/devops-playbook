configs:
  params:
    server.insecure: true
  cm:
    resource.exclusions: |
      ### Network resources created by the Kubernetes control plane
      - apiGroups:
          - ''
        kinds:
          - Endpoints
      ### Internal Kubernetes resources
      - apiGroups:
          - coordination.k8s.io
        kinds:
          - Lease
      ### Internal Authz/Authn resources
      - apiGroups:
          - authentication.k8s.io
          - authorization.k8s.io
        kinds:
          - SelfSubjectReview
          - TokenReview
          - LocalSubjectAccessReview
          - SelfSubjectAccessReview
          - SelfSubjectRulesReview
          - SubjectAccessReview
      ### Certificate requests
      - apiGroups:
          - certificates.k8s.io
        kinds:
          - CertificateSigningRequest
      - apiGroups:
          - cert-manager.io
        kinds:
          - CertificateRequest
      ### Cilium internal resources
      - apiGroups:
          - cilium.io
        kinds:
          - CiliumIdentity
          - CiliumEndpoint
          - CiliumEndpointSlice
      ### Kyverno intermediate and reporting resources
      - apiGroups:
          - kyverno.io
          - reports.kyverno.io
          - wgpolicyk8s.io
        kinds:
          - PolicyReport
          - ClusterPolicyReport
          - EphemeralReport
          - ClusterEphemeralReport
          - AdmissionReport
          - ClusterAdmissionReport
          - BackgroundScanReport
          - ClusterBackgroundScanReport
          - UpdateRequest
global:
  domain: argocd.mydomain.com
  nodeSelector:
    workload-type: system
  tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
