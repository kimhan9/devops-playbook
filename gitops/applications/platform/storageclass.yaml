apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storageclass-gp3
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kimhan9/devops-playbook.git
    targetRevision: main
    path: gitops/manifests/storageclass
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
