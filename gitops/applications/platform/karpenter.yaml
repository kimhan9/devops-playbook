apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - chart: karpenter
      repoURL: public.ecr.aws/karpenter
      targetRevision: 1.14.1
      helm:
        releaseName: karpenter
        valueFiles:
          - $values/gitops/values/karpenter-values.yaml
    - repoURL: https://github.com/kimhan9/devops-playbook.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true